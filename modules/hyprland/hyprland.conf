# Hyprland configuration

# Set mod key to super key
$mod = SUPER

# Monitor configuration
# Laptop screen (eDP-1) positioned below the ultrawide monitor
# Scale set to 1.5 to make things larger and more readable on the high-DPI screen
monitor=eDP-1,2880x1920@120,939x1600,2.0
# Dell ultrawide monitor (DP-3) positioned at top
monitor=DP-3,3840x1600@60,410x0,1

# Fallback for any other monitors
monitor=,preferred,auto,1

# Execute on startup
exec-once = hyprlock
exec-once = dunst
exec-once = waybar
exec-once = hyprpaper
exec-once = nm-applet
exec-once = hypridle
exec-once = systemctl --user start libinput-gestures.service
exec-once = wl-paste --watch cliphist store
exec-once = ~/.config/hypr/scripts/lid-handler.sh

# Launch default applications
exec-once = [workspace 1 silent] brave
exec-once = [workspace 2 silent] kitty
exec-once = [workspace 3 silent] discord
exec-once = [workspace 4 silent] signal-desktop
exec-once = [workspace 9 silent] spotify

# Environment variables
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,catppuccin-mocha-dark-cursors
env = QT_QPA_PLATFORMTHEME,qt5ct

# Input configuration
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = yes
    }

    sensitivity = 0
}

# General settings
general {
    gaps_in = 6
    gaps_out = 3
    border_size = 1
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    layout = dwindle
}

# Decoration
decoration {
    rounding = 10  # Increased from 5 for more rounded corners
    
    blur {
        enabled = true
        size = 8         # Increased blur
        passes = 3       # More blur passes for smoother effect
        new_optimizations = true
        xray = false
        ignore_opacity = false
    }

    shadow {
        enabled = true
        range = 20      # Shadow range
        render_power = 3
        color = rgba(1a1a1aee)
        color_inactive = rgba(1a1a1a99)
    }
    
    # Dim inactive windows
    dim_inactive = true
    dim_strength = 0.1
}

# Animations
animations {
    enabled = yes

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# Layouts
dwindle {
    pseudotile = yes
    preserve_split = yes
}

master {
    new_status = master
}

# Gestures (updated for Hyprland 0.51+)
gestures {
    gesture = 3, horizontal, workspace
}

# Misc
misc {
    force_default_wallpaper = 0
}

# Window rules
windowrulev2 = float, class:^(rofi)$
windowrulev2 = float, class:^(pavucontrol)$

# Workspace assignments for default applications
windowrulev2 = workspace 1, class:^(brave-browser)$
windowrulev2 = workspace 2, class:^(kitty)$
windowrulev2 = workspace 3, class:^(discord)$
windowrulev2 = workspace 4, class:^(signal)$
windowrulev2 = workspace 9, class:^(Spotify)$

# Keybindings
# Terminal
bind = $mod, Return, exec, kitty

# Kill focused window
bind = $mod SHIFT, Q, killactive,

# Rofi launcher
bind = $mod, D, exec, rofi -show drun

# Screenshots
bind = , Print, exec, ~/.config/hypr/scripts/screenshot.sh
bind = $mod, Print, exec, grimblast --notify copysave area
bind = $mod SHIFT, Print, exec, grimblast --notify copysave screen

# Screen recording
bind = $mod CTRL, R, exec, ~/.config/hypr/scripts/record.sh

# Color picker
bind = $mod SHIFT, C, exec, hyprpicker -a

# Clipboard history
bind = $mod, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy

# App launcher alternatives
bind = $mod SHIFT, D, exec, ulauncher-toggle

# File manager
bind = $mod, E, exec, thunar

# Lock screen
bind = $mod ALT, L, exec, hyprlock

# Logout (exit Hyprland)
bind = $mod SHIFT, E, exec, hyprctl dispatch exit

# Brightness - use binde for repeating action when held
binde = , XF86MonBrightnessUp, exec, brightnessctl set +5%
binde = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Volume - use binde for repeating action when held
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Media controls
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPause, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# Focus
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod, J, movefocus, l
bind = $mod, K, movefocus, d
bind = $mod, L, movefocus, u
bind = $mod, semicolon, movefocus, r

# Move windows
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d
bind = $mod SHIFT, J, movewindow, l
bind = $mod SHIFT, K, movewindow, d
bind = $mod SHIFT, L, movewindow, u
bind = $mod SHIFT, semicolon, movewindow, r

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Move to workspace
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Cycle workspaces
bind = $mod, Tab, workspace, e+1
bind = $mod SHIFT, Tab, workspace, e-1

# Split orientation
bind = $mod, H, togglesplit,
bind = $mod, V, togglesplit,

# Fullscreen
bind = $mod, F, fullscreen,

# Toggle floating
bind = $mod SHIFT, space, togglefloating,

# Focus toggle
bind = $mod, space, focuscurrentorlast,

# Layout toggle
bind = $mod, S, exec, hyprctl keyword general:layout "master"
bind = $mod, W, exec, hyprctl keyword general:layout "dwindle"
bind = $mod, E, togglesplit,

# Reload
bind = $mod SHIFT, C, exec, hyprctl reload
bind = $mod SHIFT, R, exec, hyprctl reload

# Resize mode
bind = $mod, R, submap, resize
submap = resize
binde = , right, resizeactive, 10 0
binde = , left, resizeactive, -10 0
binde = , up, resizeactive, 0 -10
binde = , down, resizeactive, 0 10
bind = , escape, submap, reset
bind = , Return, submap, reset
submap = reset

# Mouse bindings
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Focus parent/child (approximation)
bind = $mod, A, focusmonitor, +1
