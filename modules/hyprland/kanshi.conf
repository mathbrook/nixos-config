# Profile for when docked with external monitor
# Laptop screen below the ultrawide monitor
profile docked {
  output "BOE NE135A1M-NY1" mode 2880x1920@120Hz position 480,1600 scale 1
  output "Dell Inc. DELL U3821DW G303073" mode 3840x1600@60Hz position 0,0 scale 1
}

# Profile for laptop only (undocked)
profile laptop {
  output "BOE NE135A1M-NY1" mode 2880x1920@120Hz position 0,0 scale 1
}
