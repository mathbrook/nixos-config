backend = "glx";
vsync = true;

shadow = true;
shadow-radius = 12;
shadow-offset-x = -15;
shadow-offset-y = -15;
shadow-opacity = 0.3;
 
fading = false;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;


blur-method = "dual_kawase";
blur-strength = 5;

corner-radius = 8;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "class_g = 'i3-frame'"
];
