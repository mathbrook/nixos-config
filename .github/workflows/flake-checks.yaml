name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: formatting and dead-code lint, no host builds.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check formatting
        run: nix fmt -- --ci

      # Advisory only: the generated hardware-configuration.nix files carry
      # unused lambda patterns we don't hand-edit, so don't fail the build.
      - name: Lint for dead code
        run: nix run nixpkgs#deadnix -- . || true

  # Evaluate + build every host defined in the flake.
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [laptop, chonker, virtualbox, virtualbox-lg]
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Pulls Hyprland/etc. from the community cache instead of building them.
      - uses: cachix/cachix-action@v16
        with:
          name: hyprland
          skipPush: true

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"

      - name: Build ${{ matrix.host }}
        run: |
          nix build -L --no-link \
            ".#checks.x86_64-linux.host-${{ matrix.host }}"
